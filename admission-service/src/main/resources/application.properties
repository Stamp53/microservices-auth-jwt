server.port=8081
server.forward-headers-strategy=framework

# Microservice Name (Registered in Eureka for Load Balancing)
spring.application.name=ADMISSION-SERVICE

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Datasource & H2 File Database (AUTO_SERVER=TRUE allows multiple IDE/terminal processes)
spring.datasource.url=jdbc:h2:file:./data/admissiondb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false


# Stateless JWT Authentication (No server-stored sessions)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000

# Jackson Serialization
spring.jackson.serialization.fail-on-empty-beans=false
